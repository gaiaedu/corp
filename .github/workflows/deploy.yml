name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]
  # microCMS の Webhook から自動ビルドをトリガーするための設定
  repository_dispatch:
    types: [ microcms_update ]
  # GitHub Actions の画面から手動でビルド実行するための設定
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm install

      - name: Build with Astro
        env:
          SITE_URL: https://corp.gaia-edu.co.jp
          BASE_PATH: /
          MICROCMS_SERVICE_DOMAIN: ${{ secrets.MICROCMS_SERVICE_DOMAIN }}
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
          PUBLIC_BOWNOW_PRODUCT_QUERY_KEY: ${{ secrets.PUBLIC_BOWNOW_PRODUCT_QUERY_KEY || '_bq_text_field-20261119135348948~' }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
